name: AtualizaÃ§Ã£o diÃ¡ria das bases

on:
  workflow_dispatch:

  schedule:
    - cron: "17 2 * * *"
      timezone: "America/Sao_Paulo"

jobs:
  atualizar-bases:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      IILEX_USERNAME: ${{ secrets.IILEX_USERNAME }}
      IILEX_PASSWORD: ${{ secrets.IILEX_PASSWORD }}
      LOY_TOKEN_SERVICOS: ${{ secrets.LOY_TOKEN_SERVICOS }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Baixar repositÃ³rio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependÃªncias
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: I - Contencioso
        run: python I_contencioso.py

      - name: II - LOY
        run: python II_loy.py

      - name: III - HistÃ³rico
        run: python III_historico.py

      - name: IIII - Agenda
        run: python IIII_agenda.py

